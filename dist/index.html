<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Your health – demo</title>
<style>/* Stand-in reset. Replace with your own reset.css – the original was lost with the previous container. */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; }
img, picture, svg, video { display: block; max-width: 100%; }
input, button, textarea, select { font: inherit; }
p, h1, h2, h3 { overflow-wrap: break-word; }

/* ---- Design tokens ---------------------------------------------------- */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --text: #0b0c0c;
  --text-muted: #45505a;
  --border: #b1b4b6;
  --brand: #005eb8;
  --brand-dark: #003d78;
  --link: #005eb8;
  --focus: #ffdd00;
  --focus-text: #0b0c0c;

  --ok-bg: #e3f4e9;   --ok-text: #0a5c2e;
  --warn-bg: #fff3d6; --warn-text: #6b4200; --warn-edge: #ffb81c;
  --neutral-bg: #e8edf1; --neutral-text: #2f3a44;

  --radius: 12px;
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;
  --tap: 48px;
  --max: 42rem;

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 106.25%; /* 17px */
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161b;
    --surface: #1b232b;
    --text: #f1f3f5;
    --text-muted: #b9c2ca;
    --border: #4a5560;
    --brand: #5aa9ff;
    --brand-dark: #a8d0ff;
    --link: #8cc4ff;

    --ok-bg: #123524;   --ok-text: #9ee2b8;
    --warn-bg: #3a2a07; --warn-text: #ffd98a; --warn-edge: #ffb81c;
    --neutral-bg: #26313b; --neutral-text: #d5dde4;
  }
}

/* ---- Base ------------------------------------------------------------- */
body {
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

.wrap {
  width: 100%;
  max-width: var(--max);
  margin-inline: auto;
  padding-inline: var(--space-2);
}

main { flex: 1; padding-block: var(--space-3) var(--space-4); }
main:focus { outline: none; }

h1 { font-size: 1.75rem; line-height: 1.2; margin-bottom: var(--space-2); }
h2 { font-size: 1.3rem; line-height: 1.3; margin-block: var(--space-4) var(--space-1); }
p + p { margin-top: var(--space-1); }
.lead { font-size: 1.12rem; color: var(--text-muted); margin-bottom: var(--space-3); }

a { color: var(--link); text-underline-offset: 0.15em; }
a:hover { text-decoration-thickness: 3px; }

/* One focus style everywhere: yellow fill, dark text, thick underline. */
:focus-visible {
  outline: 3px solid transparent;
  background-color: var(--focus) !important;
  color: var(--focus-text) !important;
  box-shadow: 0 -2px var(--focus), 0 4px var(--focus-text);
  text-decoration: none;
}
.card:focus-visible, .list-item:focus-visible, .button:focus-visible {
  box-shadow: 0 0 0 4px var(--focus-text);
}
.card:focus-visible *, .list-item:focus-visible * { color: var(--focus-text) !important; }

/* ---- Frame ------------------------------------------------------------ */
.skip-link {
  position: absolute;
  left: var(--space-2);
  top: -100px;
  padding: var(--space-1) var(--space-2);
  background: var(--focus);
  color: var(--focus-text);
  z-index: 10;
}
.skip-link:focus { top: var(--space-1); }

.site-header { background: var(--brand); }
.site-header .wrap { min-height: 60px; display: flex; align-items: center; }
.site-name {
  color: #fff;
  font-weight: 700;
  font-size: 1.2rem;
  text-decoration: none;
  min-height: var(--tap);
  display: inline-flex;
  align-items: center;
}
@media (prefers-color-scheme: dark) {
  .site-header { background: #0b2a4a; }
}

.site-footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-block: var(--space-3);
}
.footer-heading { margin-top: 0; font-size: 1.1rem; }
.site-footer a { font-weight: 700; display: inline-block; padding-block: 0.6rem; }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: var(--tap);
  margin-bottom: var(--space-1);
}

/* ---- Cards (home) ----------------------------------------------------- */
.cards, .list, .facts { list-style: none; padding: 0; display: grid; gap: var(--space-2); }

.card, .list-item {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  min-height: var(--tap);
  padding: var(--space-2) calc(var(--space-2) + 1.5rem) var(--space-2) var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 6px solid var(--brand);
  border-radius: var(--radius);
  color: var(--text);
  text-decoration: none;
  position: relative;
}
.card::after, .list-item::after {
  content: "›";
  position: absolute;
  right: var(--space-2);
  top: 50%;
  translate: 0 -50%;
  font-size: 1.8rem;
  color: var(--brand);
}
.card:hover, .list-item:hover { border-color: var(--brand); }

.card-title, .list-title { font-weight: 700; font-size: 1.2rem; color: var(--link); text-decoration: underline; text-underline-offset: 0.15em; }
.card-text, .list-meta { color: var(--text-muted); }
.list-meta strong { color: var(--text); }
.list .tag { align-self: flex-start; margin-top: 0.2rem; }

@media (min-width: 48rem) {
  .cards { grid-template-columns: repeat(3, 1fr); }
  h1 { font-size: 2.1rem; }
}

/* ---- Tags ------------------------------------------------------------- */
.tag {
  display: inline-block;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.95rem;
}
.tag-ok { background: var(--ok-bg); color: var(--ok-text); }
.tag-warn { background: var(--warn-bg); color: var(--warn-text); }
.tag-neutral { background: var(--neutral-bg); color: var(--neutral-text); }

/* ---- Facts (definition lists) ----------------------------------------- */
.facts {
  gap: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-block: var(--space-3);
}
.facts > div { padding: var(--space-2); }
.facts > div + div { border-top: 1px solid var(--border); }
.facts dt { font-weight: 700; color: var(--text-muted); font-size: 0.95rem; }
.facts dd { margin: 0.2rem 0 0; }

/* ---- Panels ----------------------------------------------------------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left-width: 6px;
  border-radius: var(--radius);
  padding: var(--space-2);
  margin-block: var(--space-3);
}
.panel h2 { margin-top: 0; font-size: 1.15rem; }
.panel-important { background: var(--warn-bg); border-color: var(--warn-edge); }
.panel-important, .panel-important h2 { color: var(--text); }
.panel-success { background: var(--ok-bg); border-color: var(--ok-text); }

.notice {
  padding: var(--space-1) var(--space-2);
  background: var(--neutral-bg);
  color: var(--neutral-text);
  border-radius: var(--radius);
}

.bullets { padding-left: 1.4rem; }
.bullets li + li { margin-top: 0.3rem; }

/* ---- Buttons ---------------------------------------------------------- */
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: 0.6rem 1.4rem;
  background: #00703c;
  color: #fff;
  border: 0;
  border-radius: 8px;
  box-shadow: 0 3px 0 #002d18;
  font-weight: 700;
  font-size: 1.05rem;
  text-decoration: none;
  cursor: pointer;
  width: 100%;
  margin-top: var(--space-1);
}
.button:hover { background: #005a30; }
.button:active { translate: 0 2px; box-shadow: 0 1px 0 #002d18; }
@media (min-width: 30rem) { .button { width: auto; } }

/* ---- Motion ----------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  .button:active { translate: none; }
}

/* ---- Utilities -------------------------------------------------------- */
.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---- Header menu (no JavaScript: <details>) --------------------------- */
.site-header { position: relative; z-index: 5; }
.header-bar { justify-content: space-between; gap: var(--space-2); }
.menu { position: relative; }
.menu summary {
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-height: var(--tap);
  padding: 0 0.9rem;
  border: 2px solid rgb(255 255 255 / 0.8);
  border-radius: 999px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}
.menu summary::-webkit-details-marker { display: none; }
.menu-icon, .menu-icon::before, .menu-icon::after {
  display: block;
  width: 18px; height: 2px;
  background: currentColor;
  border-radius: 2px;
}
.menu-icon { position: relative; }
.menu-icon::before, .menu-icon::after { content: ""; position: absolute; left: 0; }
.menu-icon::before { top: -6px; }
.menu-icon::after { top: 6px; }
.menu[open] .menu-icon { background: transparent; }
.menu[open] .menu-icon::before { top: 0; rotate: 45deg; }
.menu[open] .menu-icon::after { top: 0; rotate: -45deg; }
.menu nav {
  position: absolute;
  right: 0;
  top: calc(100% + 0.5rem);
  min-width: 15rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.2);
  padding: var(--space-1) 0;
}
.menu nav ul { list-style: none; padding: 0; }
.menu nav a {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 var(--space-2);
  font-weight: 700;
}

/* ---- Medicines list (home) ------------------------------------------- */
.med-list { list-style: none; padding: 0; display: grid; gap: var(--space-1); }
.med-row {
  display: grid;
  gap: 0.25rem;
  padding: var(--space-2) calc(var(--space-2) + 1.25rem) var(--space-2) var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  text-decoration: none;
  position: relative;
}
.med-row::after {
  content: "›";
  position: absolute;
  right: var(--space-2);
  top: 50%;
  translate: 0 -50%;
  font-size: 1.8rem;
  color: var(--brand);
}
.med-row:hover { border-color: var(--brand); }
.med-row:focus-visible { box-shadow: 0 0 0 4px var(--focus-text); }
.med-row:focus-visible * { color: var(--focus-text) !important; }
.med-name { font-weight: 700; font-size: 1.2rem; color: var(--link); text-decoration: underline; text-underline-offset: 0.15em; }
.med-detail { display: flex; flex-direction: column; color: var(--text-muted); }

@media (min-width: 40rem) {
  .med-row { grid-template-columns: 11rem 1fr; column-gap: var(--space-2); align-items: baseline; }
  .med-detail { flex-direction: row; flex-wrap: wrap; column-gap: var(--space-2); }
}

/* ---- Big action tiles ------------------------------------------------- */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
  margin-top: var(--space-4);
}
.actions form { display: contents; }
.action-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: 7rem;
  padding: var(--space-2);
  background: #00703c;
  color: #fff;
  border: 0;
  border-radius: 24px;
  box-shadow: 0 4px 0 #002d18;
  font-weight: 700;
  font-size: 1.1rem;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.action-tile:hover { background: #005a30; }
.action-tile:active { translate: 0 2px; box-shadow: 0 2px 0 #002d18; }
.action-tile:focus-visible { box-shadow: 0 0 0 4px var(--focus-text); }
.action-tile-secondary { background: var(--surface); color: var(--link); border: 2px solid var(--brand); box-shadow: 0 4px 0 var(--brand); }
.action-tile-secondary:hover { background: var(--neutral-bg); }
.action-tile-secondary:active { box-shadow: 0 2px 0 var(--brand); }
.action-icon { width: 2.2rem; height: 2.2rem; }
.updated-note { margin-top: var(--space-2); color: var(--text-muted); font-size: 0.95rem; }

@media (prefers-reduced-motion: reduce) { .action-tile:active { translate: none; } }

/* ---- Forms ------------------------------------------------------------ */
.field { margin-bottom: var(--space-3); }
.field label { display: block; font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
.optional { font-weight: 400; color: var(--text-muted); }
.hint { color: var(--text-muted); margin-bottom: 0.3rem; }
.field input {
  width: 100%;
  min-height: var(--tap);
  padding: 0.5rem 0.75rem;
  border: 2px solid var(--text);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
}
.field input:focus-visible { background-color: var(--surface) !important; color: var(--text) !important; outline: 3px solid var(--focus); outline-offset: 0; box-shadow: inset 0 0 0 2px var(--text); }
.field-error { border-left: 5px solid var(--error); padding-left: var(--space-2); }
.field-error input { border-color: var(--error); }
.error-message { color: var(--error); font-weight: 700; margin-bottom: 0.3rem; }
.error-summary {
  border: 4px solid var(--error);
  border-radius: var(--radius);
  padding: var(--space-2);
  margin-bottom: var(--space-3);
  background: var(--surface);
}
.error-summary h2 { margin-top: 0; }
.error-summary ul { padding: 0; list-style: none; }
.error-summary a { color: var(--error); font-weight: 700; }

:root { --error: #c41e1e; }
@media (prefers-color-scheme: dark) { :root { --error: #ff8a80; } }

/* ---- Conflicts and severity ------------------------------------------ */
:root {
  --sev3: #c41e1e; --sev3-bg: #fde8e8;
  --sev2: #b25000; --sev2-bg: #fff0e0;
  --sev1: #6b5600; --sev1-bg: #fff8d6; --sev1-mark: #ffdd00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sev3: #ff8a80; --sev3-bg: #3d1414;
    --sev2: #ffb366; --sev2-bg: #3a2408;
    --sev1: #ffe066; --sev1-bg: #33300a; --sev1-mark: #ffdd00;
  }
}

.section-heading { margin-bottom: 0.2rem; }

.med-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
@media (min-width: 40rem) { .med-row .med-tags { grid-column: 2; } }

.severity { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 700; }
.severity-marks { display: inline-flex; gap: 3px; }
.mark {
  display: inline-grid;
  place-items: center;
  width: 1.5rem; height: 1.5rem;
  border-radius: 50%;
  font-size: 1rem;
  line-height: 1;
  color: #fff;
}
.severity-3 .mark { background: var(--sev3); }
.severity-2 .mark { background: var(--sev2); }
.severity-1 .mark { background: var(--sev1-mark); color: #0b0c0c; }
.severity-3 .severity-label { color: var(--sev3); }
.severity-2 .severity-label { color: var(--sev2); }
.severity-1 .severity-label { color: var(--sev1); }
@media (prefers-color-scheme: dark) { .severity-3 .mark, .severity-2 .mark { color: #0b0c0c; } }

.conflict {
  border: 3px solid var(--sev);
  background: var(--sev-bg);
  border-radius: calc(var(--radius) + 8px);
  padding: var(--space-1);
  margin-block: var(--space-2) var(--space-3);
}
.conflict-3 { --sev: var(--sev3); --sev-bg: var(--sev3-bg); }
.conflict-2 { --sev: var(--sev2); --sev-bg: var(--sev2-bg); }
.conflict-1 { --sev: var(--sev1-mark); --sev-bg: var(--sev1-bg); border-width: 2px; }
.conflict-heading {
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 0.75rem;
  margin: 0.25rem var(--space-1) var(--space-1);
  font-size: 1.05rem;
}
.conflict-advice { font-weight: 400; color: var(--text); }
.conflict .med-row { border-color: transparent; }
.conflict .med-row:hover { border-color: var(--sev); }

.conflict-link {
  display: flex; flex-direction: column; gap: 0.4rem;
  padding: var(--space-2);
  margin-block: var(--space-2);
  border: 3px solid var(--sev);
  background: var(--sev-bg);
  border-radius: var(--radius);
  color: var(--text);
}

.key { margin-top: var(--space-4); border-top: 1px solid var(--border); }
.key dl { display: grid; gap: var(--space-1); }
.key dl > div { display: grid; grid-template-columns: 9.5rem 1fr; align-items: center; gap: var(--space-1); }
.key dd { margin: 0; }

/* Conflict screen */
.pair { list-style: none; padding: 0; display: grid; gap: var(--space-1); margin-block: var(--space-3); }
.pair-item {
  display: flex; flex-direction: column; gap: 0.15rem;
  padding: var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.pair-name { font-weight: 700; font-size: 1.25rem; }
.pair-meta { color: var(--text-muted); }
.pair-item a { display: inline-flex; align-items: center; min-height: var(--tap); align-self: flex-start; }
.pair-join { text-align: center; font-size: 1.8rem; font-weight: 700; line-height: 1; color: var(--text-muted); }
@media (min-width: 40rem) {
  .pair { grid-template-columns: 1fr auto 1fr; align-items: center; }
}
.steps { padding-left: 1.5rem; }
.steps li + li { margin-top: 0.5rem; }

/* ---- Tappable "!" strip on home -------------------------------------- */
.conflict-heading { margin: 0 0 var(--space-1); }
.conflict-open {
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 0.75rem; row-gap: 0.2rem;
  min-height: var(--tap);
  padding: 0.4rem 2.2rem 0.4rem var(--space-1);
  border-radius: var(--radius);
  color: var(--text);
  text-decoration: none;
  position: relative;
}
.conflict-open:hover { background: rgb(0 0 0 / 0.05); }
.conflict-open .conflict-advice { text-decoration: underline; text-underline-offset: 0.15em; }
.conflict-chevron { position: absolute; right: var(--space-1); top: 50%; translate: 0 -50%; font-size: 1.8rem; color: var(--sev); }
.conflict-open:focus-visible { box-shadow: 0 0 0 4px var(--focus-text); }
.conflict-open:focus-visible * { color: var(--focus-text) !important; }
.conflict .mark { width: 1.75rem; height: 1.75rem; font-size: 1.1rem; }

/* ---- Conflict summary (wireframe 3) ----------------------------------- */
.round-back {
  display: inline-flex; align-items: center; gap: 0.6rem;
  min-height: var(--tap);
  margin-bottom: var(--space-2);
  font-weight: 700;
  color: var(--link);
  text-decoration: none;
}
.round-back-icon {
  display: inline-grid; place-items: center;
  width: var(--tap); height: var(--tap);
  border: 2px solid currentColor;
  border-radius: 50%;
}
.round-back-icon svg { width: 1.4rem; height: 1.4rem; }
.round-back:hover .round-back-icon { background: var(--neutral-bg); }
.round-back:focus-visible .round-back-icon { border-color: var(--focus-text); }

.summary-severity { margin-bottom: 0.25rem; }

.contact-list { list-style: none; padding: 0; display: grid; gap: var(--space-1); margin-block: var(--space-3); }
.contact-row {
  display: grid; gap: 0.2rem;
  padding: var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.contact-med { font-weight: 700; font-size: 1.2rem; }
.contact-who { color: var(--text-muted); }
.contact-action { margin-top: 0.4rem; }
.contact-note { font-weight: 700; }
.call {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: var(--tap);
  padding: 0.5rem 1rem;
  border: 2px solid var(--brand);
  border-radius: 999px;
  font-weight: 700;
  text-decoration: none;
}
.call svg { width: 1.2rem; height: 1.2rem; flex: none; }
.call:hover { background: var(--neutral-bg); }
@media (min-width: 40rem) {
  .contact-row { grid-template-columns: 1fr 1fr auto; align-items: center; column-gap: var(--space-2); }
  .contact-action { margin-top: 0; }
}

.description-heading { margin-top: var(--space-4); }
.description { font-size: 1.2rem; line-height: 1.5; }

/* ---- Demo note (static build only) ----------------------------------- */
.demo-note { margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px dashed var(--border); color: var(--text-muted); }
.demo-reset {
  min-height: var(--tap);
  margin-top: var(--space-1);
  padding: 0.5rem 1rem;
  background: transparent;
  color: var(--link);
  border: 2px solid currentColor;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
